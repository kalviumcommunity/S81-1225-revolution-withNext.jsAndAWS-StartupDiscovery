name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: startupdiscovery/package-lock.json

      - name: Install dependencies
        working-directory: ./startupdiscovery
        run: npm ci

      - name: Run ESLint
        working-directory: ./startupdiscovery
        run: npm run lint

      - name: Check Prettier formatting
        working-directory: ./startupdiscovery
        run: npm run format:check

      - name: TypeScript type check
        working-directory: ./startupdiscovery
        run: npm run type-check

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: lint-and-format
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: startupdiscovery/package-lock.json

      - name: Install dependencies
        working-directory: ./startupdiscovery
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./startupdiscovery
        run: npx prisma generate

      - name: Build Next.js application
        working-directory: ./startupdiscovery
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/startupdiscovery
          REDIS_URL: redis://localhost:6379
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: startupdiscovery/.next
          retention-days: 7

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./startupdiscovery
          file: ./startupdiscovery/Dockerfile
          push: false
          tags: startupdiscovery:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

