name: Production Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-production:
    name: Build Production Environment
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for Production
        run: npm run build:production
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID_PRODUCTION }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET_PRODUCTION }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID_PRODUCTION }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET_PRODUCTION }}

      - name: Run Linter
        run: npm run lint

      - name: Security Scan - Verify no secrets in build output
        run: |
          echo "Running security checks..."
          if grep -r "client_secret" .next/; then
            echo "ERROR: Potential secrets found in build output!"
            exit 1
          fi
          if grep -r "password" .next/ | grep -v node_modules; then
            echo "ERROR: Potential secrets found in build output!"
            exit 1
          fi
          echo "✓ Security check passed - No secrets in build output"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: .next/
          retention-days: 30

      - name: Create deployment summary
        run: |
          echo "## Production Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status**: ✓ Success" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: Deploy to Production
    needs: build-production
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: .next/

      - name: Deploy to Production Environment
        run: |
          echo "Deploying to production environment..."
          echo "In production, this would deploy to AWS, Vercel, or similar."
          echo "Build timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Commit SHA: ${{ github.sha }}"
          echo ""
          echo "Secrets were safely injected via GitHub Environment Secrets"
          echo "No sensitive data is exposed in logs or build artifacts"
