version: '3.8'

# ============================================
# Docker Compose Configuration
# StartupDiscovery - Local Development Setup
# ============================================

services:
  # ==========================================
  # Service 1: Next.js Application
  # ==========================================
  app:
    container_name: startupdiscovery-app
    build:
      context: ./startupdiscovery
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/startupdiscovery
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    networks:
      - startupdiscovery-network
    restart: unless-stopped

  # ==========================================
  # Service 2: PostgreSQL Database
  # ==========================================
  db:
    container_name: startupdiscovery-db
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=startupdiscovery
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - startupdiscovery-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Service 3: Redis Cache
  # ==========================================
  redis:
    container_name: startupdiscovery-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - startupdiscovery-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

# ============================================
# Networks Configuration
# ============================================
networks:
  startupdiscovery-network:
    driver: bridge

# ============================================
# Volumes Configuration
# ============================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
