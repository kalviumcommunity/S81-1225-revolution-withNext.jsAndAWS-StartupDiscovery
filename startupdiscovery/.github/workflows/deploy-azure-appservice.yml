name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: startupdiscovery
  CONTAINER_REGISTRY: kalviumregistry.azurecr.io
  IMAGE_NAME: startupdiscovery

jobs:
  build-and-deploy:
    name: Build and Deploy to Azure
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        id: build-image
        run: |
          IMAGE_TAG=${{ github.sha }}
          FULL_IMAGE_NAME=${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG
          
          # Build image
          docker build -t $FULL_IMAGE_NAME .
          docker tag $FULL_IMAGE_NAME ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          # Push to ACR
          docker push $FULL_IMAGE_NAME
          docker push ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          echo "image=$FULL_IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ steps.build-image.outputs.image }}

      - name: Verify deployment
        run: |
          echo "Deployment completed successfully!"
          echo "Image: ${{ steps.build-image.outputs.image }}"
          echo "App URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"

      - name: Azure logout
        run: |
          az logout
